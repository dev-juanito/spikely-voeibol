<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Técnica - Spikely</title>
  <meta name="description" content="Sección técnica - Spikely Volley" />
  <link rel="stylesheet" href="spikely.css" />
  <style>
    /* Ajustes específicos solo para esta página */
    .tecnica-page {
      padding: 4.5rem 0 6rem;
    }

    .tecnica-header {
      text-align: center;
      margin-bottom: 2.25rem;
    }

    .tecnica-header h1 {
      font-size: 2.25rem;
      font-weight: 800;
      margin-bottom: .75rem;
    }

    .tecnica-header p {
      color: var(--muted);
      max-width: 52rem;
      margin: 0 auto;
    }

    .tecnica-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.75rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
    }

    .tecnica-actions {
      display: flex;
      justify-content: center;
      margin-top: 1.25rem;
    }

    .tecnica-actions .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: .85rem 1.25rem;
      border-radius: .75rem;
      border: 1px solid var(--orange);
      background: var(--orange-100);
      color: var(--orange-700);
      font-weight: 800;
      transition: transform .08s ease, background .15s ease;
      user-select: none;
    }

    .tecnica-actions .btn:active { transform: scale(0.99); }
    .tecnica-actions .btn:hover { background: var(--orange-50); }

    .encuesta-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      margin-top: 1.5rem;
    }

    @media (min-width: 768px) {
      .encuesta-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .encuesta-item {
      border: 1px dashed rgba(234,88,12,0.35);
      border-radius: .9rem;
      padding: 1rem;
      background: rgba(255,247,237,0.6);
    }

    .encuesta-item img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: .75rem;
      border: 1px solid var(--border);
      background: #fff;
    }

    .encuesta-item .label {
      margin-top: .75rem;
      font-size: .9rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>

<body id="top">
